# =============================================================================
# repeat_compare — config.yaml
#
# All tunable values live here; nothing is hard-coded in the Snakefile or
# scripts. Starting values below are a first guess (per the spec this repo
# was built from) — tune after the first real cluster run. Check the target
# SGE queue's maximum `h_rt` before relying on the `hrs` values below,
# especially for `repeatmodeler`.
# =============================================================================

manifest: manifest.tsv
# results_v2: the restructured pipeline (rounds-only RepeatModeler + LTR side
# pipeline + satellite screen) writes to a fresh directory, so the runs made
# with the previous version (RepeatModeler -LTRStruct, in results/) stay
# untouched.
outdir: results_v2

genome_prep:
  min_contig_len: 0            # 0 = keep everything
  max_header_len: 50           # RepeatMasker rejects long sequence names
  test_subsample_bp: 0         # >0 = keep only first N bp per species, for wiring tests

repeatmodeler:
  # dfam/tetools, run via Singularity; pinned to the tag whose digest matched
  # `latest` when the first runs were made (RepeatModeler 2.0.9,
  # LTR_retriever 2.9.0, genometools 1.6.4). BuildDatabase, RepeatModeler,
  # the LTR side pipeline and RepeatClassifier all run in this one image.
  container: "docker://dfam/tetools:2.00"
  # RepeatModeler runs RECON/RepeatScout rounds only -- there is no
  # ltrstruct key any more (LTR discovery is the ltr_* rules). Deeper
  # sampling, if discovery_round_saturation.tsv says the last round still
  # matters: "-numAddlRounds 1" (same value for every species).
  extra_args: ""

satellite:
  # compare_assemblies_satellites stage 02b results dir
  # (.../results/02b_taxonomy_harmonization). When set: its harmonized
  # satellite library is snapshotted into {outdir}/satellite_harmonization/
  # and used for every species (manifest column 6 = per-species override),
  # and each species' code (EST, MLI, ...) is taken from 02b's
  # taxonomy_cache by matching the manifest species_name. Empty: manifest
  # column 6 only, codes = species_id.
  harmonization_dir: ""
  # A manifest species missing from 02b's taxonomy_cache is an error unless
  # this is true (then it falls back to its species_id, with a warning).
  allow_unharmonized: false
  # Per-contig "mostly satellite" flag (informational only).
  per_contig_flag_pct: 50
  # satellite_relabel: an rnd-*#Unknown family whose consensus is covered at
  # least this much by satellite-library hits is relabeled #Satellite.
  relabel_min_cov: 0.5
  # satellite_library_qc: each motif vs the operational definition used by
  # compare_assemblies_satellites (TRF motifs, run with min_period_length 75;
  # 2000 = TRF's maximum period). Report-only -- nothing is filtered.
  qc:
    min_monomer_len: 75
    max_monomer_len: 2000
    min_copies: 100            # genome-wide: merged hit bp / monomer length
    min_array_copies: 3        # a chained run of hits this many monomers long = tandem array
    min_tandem_frac: 0.5       # fraction of a motif's bp that must sit in tandem arrays
    max_short_period_frac: 0.5 # monomer covered by a period-1..10 self-repeat ((CA)n-like)
    # Copy tiers (context only, not pass/fail): "major" = >= major_min_copies
    # genome-wide copies OR >= major_min_bp of sequence; "minor" = passes
    # min_copies but not major. min_copies is an inclusion floor (100 copies is
    # 7.5-200 kb); see plots/satellite_copy_distribution.png for where the gap is.
    major_min_copies: 1000
    major_min_bp: 100000

ltr_discovery:
  # SGE-level parallelism: whole scaffolds split into this many bp-balanced
  # groups (one ltr_harvest_group / ltr_finder_group job each).
  n_groups: 8
  # Thread-level parallelism inside each group: windows of window_size bp
  # overlapping by overlap bp, each killed after window_timeout_s seconds;
  # with try1: 1 a timed-out window is re-run as 50 kb pieces (20 kb
  # overlap, 30 s / 10 s timeouts) before its sequence is logged as skipped.
  window_size: 5000000
  overlap: 100000
  window_timeout_s: 1500
  try1: 1
  # "" = gt ltrharvest defaults, i.e. exactly what RepeatModeler's own
  # LTRPipeline runs. LTR_retriever's recommendation, for comparison:
  # "-minlenltr 100 -maxlenltr 7000 -mintsd 4 -maxtsd 6 -motif TGCA -motifmis 1 -similar 85 -vic 10 -seed 20 -seqids yes"
  ltrharvest_args: ""
  # LTR_FINDER candidates in addition to LTRharvest (the one deliberate
  # sensitivity addition beyond RepeatModeler; say so in methods).
  use_ltr_finder: true
  ltr_finder_args: "-w 2 -C -D 15000 -d 1000 -L 7000 -l 100 -p 20 -M 0.85"

library:
  species_prefix_sep: "_"
  cdhit:
    identity: 0.8              # -c
    coverage_short: 0.8        # -aS
    word_size: 5               # -n
  protein_filter:              # optional, off by default
    enabled: false
    protein_fasta: ""
  include_dfam: true
  dfam_taxon: "Vertebrata"     # exported via famdb.py, see README §FamDB
  famdb_local_dir: ""          # existing local dir of *.h5 FamDB partitions, if you have one
  famdb_fallback_urls: []      # else, URL(s) to download FamDB partitions from
  curated_override: ""         # path to a curated shared-library FASTA; if set, replaces clustering (§8)

repeatmasker:
  sensitive: true              # -s ; must be identical across all arms/species (asserted at parse time)
  cores_per_pa: 4              # rmblast uses ~4 cores per -pa slot
  extra_args: ""
  scatter_count: 10            # genome chunks per species for the repeatmasker scatter/gather

summary:
  denominator: "non_n"         # non_n | total ; both are always written, this picks the headline
  landscape_max_div: 50

resources:
  prep_genome:      {threads: 1,  mem: 8,  hrs: 4}
  genome_fingerprint: {threads: 1, mem: 8, hrs: 2}
  assembly_stats:   {threads: 1,  mem: 8,  hrs: 4}
  build_db:         {threads: 1,  mem: 16, hrs: 4}
  repeatmodeler:    {threads: 24, mem: 4,  hrs: 96}
  prefix_library:   {threads: 1,  mem: 4,  hrs: 1}
  cluster_library:  {threads: 16, mem: 2,  hrs: 4}
  export_dfam:      {threads: 1,  mem: 8,  hrs: 2}
  setup_famdb:      {threads: 1,  mem: 8,  hrs: 2}
  library_membership: {threads: 1, mem: 4, hrs: 1}
  own_library:      {threads: 1,  mem: 4,  hrs: 1}
  assemble_shared_library: {threads: 1, mem: 4, hrs: 1}
  split_genome:     {threads: 1,  mem: 4,  hrs: 2}
  # NOTE: sized PER CHUNK now (repeatmasker.scatter_count chunks run
  # concurrently per species/arm), not per whole genome as before this
  # rule became scatter/gather -- untuned placeholder, adjust from real
  # wiring-test chunk runtimes.
  repeatmasker:     {threads: 4,  mem: 4,  hrs: 12}
  gather_repeatmasker: {threads: 1, mem: 4, hrs: 2}
  divergence:       {threads: 1,  mem: 16, hrs: 8}
  summarize:        {threads: 1,  mem: 8,  hrs: 2}
  combine_summaries: {threads: 1, mem: 8,  hrs: 1}
  provenance:       {threads: 1,  mem: 2,  hrs: 1}
  plot:             {threads: 1,  mem: 8,  hrs: 1}
  # --- satellite screen ---
  snapshot_harmonization: {threads: 1, mem: 2, hrs: 1}
  satellite_screen: {threads: 8,  mem: 2,  hrs: 12}   # per chunk (repeatmasker.scatter_count chunks)
  satellite_coverage: {threads: 1, mem: 16, hrs: 2}
  satellite_library_qc: {threads: 1, mem: 16, hrs: 2}
  # --- LTR side pipeline ---
  ltr_mask:         {threads: 1,  mem: 16, hrs: 2}
  ltr_group_genome: {threads: 1,  mem: 16, hrs: 2}
  # per group; threads must be >= 2 (see Snakefile). mem is per slot.
  ltr_harvest_group: {threads: 16, mem: 2, hrs: 24}
  ltr_finder_group: {threads: 16, mem: 2,  hrs: 24}
  ltr_gather:       {threads: 1,  mem: 16, hrs: 2}
  # LTR_retriever + MAFFT (up to 10,000 sequences) + NINJA + Refiner
  ltr_pipeline:     {threads: 16, mem: 4,  hrs: 48}
  merge_families:   {threads: 8,  mem: 2,  hrs: 4}
  classify_families: {threads: 16, mem: 2, hrs: 24}
  satellite_relabel: {threads: 8, mem: 2,  hrs: 4}
