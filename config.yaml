# =============================================================================
# repeat_compare — config.yaml
#
# All tunable values live here; nothing is hard-coded in the Snakefile or
# scripts. Starting values below are a first guess (per the spec this repo
# was built from) — tune after the first real cluster run. Check the target
# SGE queue's maximum `h_rt` before relying on the `hrs` values below,
# especially for `repeatmodeler`.
# =============================================================================

manifest: manifest.tsv
# results_v2: the restructured pipeline (rounds-only RepeatModeler + LTR side
# pipeline) writes to a fresh directory, so the runs made
# with the previous version (RepeatModeler -LTRStruct, in results/) stay
# untouched.
outdir: results_v2

# "" = normal. Path to an existing shared library FASTA = the shared arm masks
# with it and no discovery/library rules run; use with the mask_shared_only
# target (usually set via --config on the command line, see README).
mask_shared_library: ""

genome_prep:
  min_contig_len: 0            # 0 = keep everything
  max_header_len: 50           # RepeatMasker rejects long sequence names
  test_subsample_bp: 0         # >0 = keep only first N bp per sample, for wiring tests

repeatmodeler:
  # dfam/tetools, run via Singularity; pinned to the tag whose digest matched
  # `latest` when the first runs were made (RepeatModeler 2.0.9,
  # LTR_retriever 2.9.0, genometools 1.6.4). BuildDatabase, RepeatModeler,
  # the LTR side pipeline and RepeatClassifier all run in this one image.
  container: "docker://dfam/tetools:2.00"
  # RepeatModeler runs RECON/RepeatScout rounds only -- there is no
  # ltrstruct key any more (LTR discovery is the ltr_* rules).
  extra_args: ""               # don't put -numAddlRounds here; use extra_rounds
  # Rounds beyond RepeatModeler's 5 (each samples another 270 Mb). A finished
  # run is extended (copied to RM_*.ext; the original stays), not redone.
  # Raise it one at a time, checking discovery_round_novelty.tsv in between.
  extra_rounds: 0

ltr_discovery:
  # SGE-level parallelism: whole scaffolds split into this many bp-balanced
  # groups (one ltr_harvest_group / ltr_finder_group job each).
  n_groups: 8
  # Thread-level parallelism inside each group: windows of window_size bp
  # overlapping by overlap bp, each killed after window_timeout_s seconds;
  # with try1: 1 a timed-out window is re-run as 50 kb pieces (20 kb
  # overlap, 30 s / 10 s timeouts) before its sequence is logged as skipped.
  window_size: 5000000
  overlap: 100000
  window_timeout_s: 1500
  try1: 1
  # "" = gt ltrharvest defaults, i.e. exactly what RepeatModeler's own
  # LTRPipeline runs. LTR_retriever's recommendation, for comparison:
  # "-minlenltr 100 -maxlenltr 7000 -mintsd 4 -maxtsd 6 -motif TGCA -motifmis 1 -similar 85 -vic 10 -seed 20 -seqids yes"
  ltrharvest_args: ""
  # LTR_FINDER candidates in addition to LTRharvest (the one deliberate
  # sensitivity addition beyond RepeatModeler; say so in methods).
  use_ltr_finder: true
  ltr_finder_args: "-w 2 -C -D 15000 -d 1000 -L 7000 -l 100 -p 20 -M 0.85"

library:
  sample_prefix_sep: "_"
  cdhit:
    identity: 0.8              # -c
    coverage_short: 0.8        # -aS
    word_size: 5               # -n
  protein_filter:              # optional, off by default
    enabled: false
    protein_fasta: ""
  include_dfam: true
  dfam_taxon: "Vertebrata"     # exported via famdb.py, see README §FamDB
  famdb_local_dir: ""          # existing local dir of *.h5 FamDB partitions, if you have one
  famdb_fallback_urls: []      # else, URL(s) to download FamDB partitions from
  curated_override: ""         # path to a curated shared-library FASTA; if set, replaces clustering (§8)

repeatmasker:
  sensitive: true              # -s ; must be identical across all arms/sample (asserted at parse time)
  cores_per_pa: 4              # rmblast uses ~4 cores per -pa slot
  extra_args: ""
  scatter_count: 10            # genome chunks per sample for the repeatmasker scatter/gather

# family_tandem: every shared-library family checked against the operational
# satellite definition the removed satellite arm's satellite_library_qc used
# (README "Tandem check"). Report-only.
family_tandem:
  # Report Unknown families that pass copies + tandem + not-simple (any
  # consensus length) as their own class, Unknown_tandem, in the composition,
  # landscape and concordance tables and plots.
  carve_unknown: true
  min_cons_len: 75             # consensus length window (TRF min_period_length .. TRF max period)
  max_cons_len: 2000
  min_copies: 100              # genome-wide: merged hit bp / consensus length
  min_array_copies: 3          # a chained run of hits this many consensus lengths long = tandem array
  min_tandem_frac: 0.5         # fraction of a family's bp that must sit in tandem arrays
  max_short_period_frac: 0.5   # consensus covered by period-1..10 exact self-repeat
  major_min_copies: 1000       # copy_tier "major": >= this many copies ...
  major_min_bp: 100000         # ... or >= this many bp

# Reclassify Unknown families (README "Reclassifying Unknown families").
# Three cheap screens of every Unknown consensus in the shared library; labels
# are applied at summarize time, nothing is remasked. A screen whose input is
# left empty is skipped (treated as "no evidence").
classify:
  enabled: true
  # Screen only the de novo families (sample-prefixed); curated Dfam entries
  # keep their labels. true = also screen/verify the Dfam export.
  screen_dfam: false
  # Host-gene screen (DIAMOND). One TE-cleaned database serves every sample.
  # Annotation proteomes are keyword- AND TEsorter-domain-filtered; Swiss-Prot
  # is keyword-filtered only. E.g. the NCBI annotation's complete.proteins.faa.
  annotation_proteins: []      # [/path/Esto/complete.proteins.faa, /path/MLI_proteins.faa]; .gz fine
  swissprot_fasta: ""          # optional: uniprot_sprot.fasta.gz as downloaded from UniProt
  te_protein_keywords: [transposase, "reverse transcriptase", integrase, "retrovirus-related",
                        "gag protein", "gag-pol", "pol polyprotein", "transposable element",
                        transposon, "rnase h", "endonuclease/reverse", "piggybac", "line-1", "orf2p"]
  diamond_max_evalue: 1.0e-10
  min_host_cov: 0.3            # fraction of the consensus the best host protein's HSPs cover
  host_max_copies: 50          # a host-protein match labels a family Other/host_gene only if it has
                               # <= this many .out hits in every sample; above it the "gene" is a TE
                               # ORF the annotation called a gene (note/status host_annotated_te_orf)
  # Curated families (README "Naming curated elements"): a TSV in the
  # family_groups.py format with class_family filled. Its labels win over
  # RepeatClassifier and the screens in every summary; its elements are also
  # summed in element_groups.tsv. "" = none.
  curated_families: ""
  # Structured RNA (Infernal cmscan). Point at the download as-is; the
  # pipeline copies/gunzips it into {outdir}/classify/rfam/ and cmpress'es it.
  rfam_cm: ""                  # e.g. /path/Rfam.cm.gz (ftp.ebi.ac.uk/pub/databases/Rfam/CURRENT/)
  min_rfam_cov: 0.5            # fraction of the consensus the Rfam hit covers
  # Protein domains (TEsorter; REXdb metazoa + GyDB, bundled with TEsorter)
  tesorter_min_cov: 20         # TEsorter -cov (% of the domain HMM)
  tesorter_max_evalue: 1.0e-3  # TEsorter -eval
  tesorter_min_domains: 1      # domains a call needs to be used

summary:
  denominator: "non_n"         # non_n | total ; both are always written, this picks the headline
  landscape_max_div: 50
  # Left-to-right sample order in the plots (sample_id). Empty = manifest
  # order. [Mlim, Esto] matches the collaborator's figure.
  plot_sample_order: [Mlim, Esto]
  # Optional: TSV of families that are pieces of one element (group, family
  # columns; family_groups.py members). Adds element_groups.tsv. "" = off.
  element_groups: ""
  # curation_candidates.tsv: families holding >= this % of a sample's masked
  # bp that are Unknown, too long for their label, flagged by verify_classes,
  # or younger than curation_young_div (median .out divergence %).
  curation_min_pct_masked: 0.1
  curation_young_div: 3.0

# Satellite / rDNA / mito cross-check (README "Satellite, rDNA and mito
# cross-check"). Report-only for now: writes summary/satellite_*.tsv,
# nothing is relabelled. "" = off. Run alone with the
# satellite_crosscheck_only target (+ --rerun-triggers mtime).
satellite_crosscheck:
  # TSV, header: sample_id tidecluster_dir tidecluster_prefix ribotin_fa mitohifi_fa
  # (example: external_annotations.example.tsv). No blank cells: "." / NA = not provided.
  external_annotations: ""
  # true: summarize also applies the proposals (summary/satellite_proposals.tsv)
  # at apply_confidence, after classify.curated_families (yours wins on
  # conflict). false: report only (review the proposals, curate by hand).
  apply: true
  apply_confidence: [high]     # add medium to apply those too
  # Samples without TideCluster borrow evidence from a same-taxon sample with
  # it (manifest `taxon`) automatically; list pairs here only to override,
  # e.g. {ind8: ind6}. Inferred evidence can confirm a call made from the
  # donor, never create one.
  infer_from: {}
  # Always evaluated in the pair table (full library names).
  focus_families: []
  # Pairs a previous analysis judged independent: flagged if the pair test
  # says otherwise, and never grouped. e.g. [[famA, famB]]
  expected_independent: []
  # Optional: the satellite pipeline's harmonized motif library (one unit
  # per record, e.g. harmonized_repeatmasker_lib.fasta). Adds sequence
  # evidence and names: a family made of a known unit is called Satellite
  # and grouped under the motif ID, even where TideCluster missed its arrays.
  harmonized_library: ""
  motif_high_cov: 0.7          # high: >= this fraction of the consensus matches a tiled motif ...
  motif_high_id: 85            # ... at >= this % identity
  motif_min_cov: 0.5           # medium: >= this fraction at >= motif_min_id
  motif_min_id: 75
  motif_partial_cov: 0.15      # partial (chimera flag): >= this fraction at >= motif_high_id
  motif_array_tandem_frac: 0.5 # motif alone: above "low" only with arrays (tandem_family, tandem_frac >= this, or frac_in_trc >= partial_trc_cov)
  # A non-tandem sample counts toward "all eligible samples" only if it holds
  # >= this share of the family's top-sample bp (stray copies don't veto).
  eligible_min_share: 0.1
  allow_seqid_mismatch: false  # true = keep going when TideCluster's assembly differs (drops those contigs)
  candidate_min_trc_bp: 10000  # library families with this much bp in TRC arrays enter the blastn
  blast_evalue: 1.0e-10
  min_trc_cov: 0.7             # Satellite: >= this fraction of the family's bp in TRC arrays ...
                               # ... in every TideCluster sample where it holds >= family_tandem.major_min_bp
  partial_trc_cov: 0.3         # Satellite (medium): tandem, but only this..min_trc_cov of its bp in TRCs
  min_pair_id: 80              # same_satellite: consensus identity (%) ...
  min_pair_cov: 0.5            # ... over this fraction of one consensus ...
  min_shared_trc_frac: 0.5     # ... AND sharing TRCs (overlap coefficient of their TRC bp) ...
  min_shared_trc_bp: 50000     #     (a sample counts only if both families hold >= this bp in its TRCs)
  monomer_tol: 0.05            # ... AND monomers within 5% (or an integer multiple: HOR-like)
  related_min_id: 65           # same_satellite_diverged / related_*: identity >= this over min_pair_cov
  independent_max_cov: 0.2     # independent: consensi overlap < this ...
  max_independent_shared_frac: 0.1   # ... and <= this TRC sharing
  min_tandem_frac_long: 0.9    # unit (KITE founder, else consensus period/length) longer than TideHunter's
                               # -P: Satellite on family_tandem arrays alone if tandem_frac >= this
                               # (medium for Unknown, low for TE-labelled families)
  rdna_min_cov: 0.5            # rRNA: this fraction of the consensus matches a ribotin model ...
  rdna_min_id: 90              # ... at >= this % identity
  mito_min_cov: 0.5            # Other/NUMT: same against the MitoHiFi mitogenome
  mito_min_id: 80

resources:
  prep_genome:      {threads: 1,  mem: 8,  hrs: 4}
  genome_fingerprint: {threads: 1, mem: 8, hrs: 2}
  assembly_stats:   {threads: 1,  mem: 8,  hrs: 4}
  build_db:         {threads: 1,  mem: 16, hrs: 4}
  repeatmodeler:    {threads: 24, mem: 4,  hrs: 96}
  prefix_library:   {threads: 1,  mem: 4,  hrs: 1}
  cluster_library:  {threads: 16, mem: 2,  hrs: 4}
  export_dfam:      {threads: 1,  mem: 8,  hrs: 2}
  setup_famdb:      {threads: 1,  mem: 8,  hrs: 2}
  library_membership: {threads: 1, mem: 4, hrs: 1}
  discovery_summary: {threads: 1, mem: 4, hrs: 1}
  dfam_overlap:     {threads: 4,  mem: 2,  hrs: 2}
  own_library:      {threads: 1,  mem: 4,  hrs: 1}
  assemble_shared_library: {threads: 1, mem: 4, hrs: 1}
  split_genome:     {threads: 1,  mem: 4,  hrs: 2}
  # NOTE: sized PER CHUNK now (repeatmasker.scatter_count chunks run
  # concurrently per sample/arm), not per whole genome as before this
  # rule became scatter/gather -- untuned placeholder, adjust from real
  # wiring-test chunk runtimes.
  repeatmasker:     {threads: 4,  mem: 4,  hrs: 12}
  gather_repeatmasker: {threads: 1, mem: 4, hrs: 2}
  divergence:       {threads: 1,  mem: 16, hrs: 8}
  summarize:        {threads: 1,  mem: 16, hrs: 6}   # parses the multi-Gb .align for the landscape
  family_tandem:    {threads: 1,  mem: 16, hrs: 4}
  classify_light:   {threads: 1,  mem: 4,  hrs: 1}    # extract / host_proteins_prep / reclassify_unknown
  tesorter:         {threads: 16, mem: 1,  hrs: 12}   # Unknown consensi (fast) and annotation proteins (hours)
  diamond:          {threads: 16, mem: 2,  hrs: 6}
  rfam_scan:        {threads: 16, mem: 1,  hrs: 6}
  combine_summaries: {threads: 1, mem: 8,  hrs: 1}
  provenance:       {threads: 1,  mem: 2,  hrs: 1}
  plot:             {threads: 1,  mem: 8,  hrs: 1}
  # --- satellite cross-check ---
  trc_regions:      {threads: 1,  mem: 8,  hrs: 1}
  trc_crosscheck:   {threads: 1,  mem: 16, hrs: 4}   # parses the shared-arm .out
  satellite_blast:  {threads: 8,  mem: 1,  hrs: 4}
  satellite_evidence: {threads: 1, mem: 8, hrs: 1}
  # --- LTR side pipeline ---
  ltr_group_genome: {threads: 1,  mem: 16, hrs: 2}
  # per group; threads must be >= 2 (see Snakefile). mem is per slot.
  ltr_harvest_group: {threads: 16, mem: 2, hrs: 24}
  ltr_finder_group: {threads: 16, mem: 2,  hrs: 24}
  ltr_gather:       {threads: 1,  mem: 16, hrs: 2}
  # LTR_retriever + MAFFT (up to 10,000 sequences) + NINJA + Refiner
  ltr_pipeline:     {threads: 16, mem: 4,  hrs: 48}
  merge_families:   {threads: 8,  mem: 2,  hrs: 4}
  classify_families: {threads: 16, mem: 2, hrs: 24}
