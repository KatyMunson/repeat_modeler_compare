name: tetrimmer
channels:
  - conda-forge
  - bioconda
dependencies:
  # TEtrimmer (Qian et al.) and its dependencies (BLAST, MAFFT, CD-HIT, HMMER,
  # pfam_scan, RepeatMasker/RepeatModeler for RepeatClassifier, TRF, R ...).
  # Upstream recommends python 3.10 + samtools 1.22.1 next to bioconda::tetrimmer.
  # "ClobberWarning" for blast vs rmblast binaries during the build is expected.
  # Unpinned, the solver fell back to RepeatMasker 4.0.7 (perl 5.22, 2017)
  # and the matching old RepeatModeler; TEtrimmer classifies with
  # RepeatClassifier, so keep both current.
  - python=3.10
  - samtools=1.22.1
  - tetrimmer=1.7.2
  - repeatmasker>=4.1.5
  - repeatmodeler>=2.0.5
  - blast>=2.14
